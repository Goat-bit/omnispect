version: '3.8'

services:
  backend:
    build: ./backend
    container_name: omnispect-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    restart: always

  frontend:
    build: ./frontend
    container_name: omnispect-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: omnispect-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: omnispect-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: always

volumes:
  sqlite_data: